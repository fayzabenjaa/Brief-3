<body>
    <header id="header" class="bg-[#1E293B] text-white p-4">

        <div class="grid grid-cols-3">

                <img src="ball-football-svgrepo-com (1).svg" class="w-5 bg-white rounded-4xl">

            </div>
            <div>

                    <div class="w-2 h-2 bg-blue-600 rounded-full"></div>
